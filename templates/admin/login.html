{% extends "base.html" %}

{% block title %}Admin Login - Smart Parking{% endblock %}

{% block extra_css %}
<style>
    .admin-login-container {
        min-height: calc(100vh - 200px);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .admin-card {
        max-width: 450px;
        background: white;
        border-radius: 1.5rem;
        padding: 3rem;
        box-shadow: 0 20px 60px rgba(239, 68, 68, 0.2);
        border: 2px solid #FEE2E2;
    }

    .admin-icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 2.5rem;
        color: white;
    }
</style>
{% endblock %}

{% block content %}
<div class="admin-login-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12">
                <div class="admin-card mx-auto">
                    <div class="text-center mb-4">
                        <div class="admin-icon">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h2 class="fw-bold mb-2">Admin Access</h2>
                        <p class="text-muted">Secure administrator login</p>
                    </div>

                    <form method="POST" action="{{ url_for('admin_login') }}">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <input type="email" class="form-control form-control-lg" id="email" name="email"
                                placeholder="admin@smartparking.com" required autofocus>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password"
                                placeholder="Enter admin password" required>
                        </div>

                        <button type="submit" class="btn btn-danger btn-lg w-100 mb-3">
                            <i class="bi bi-shield-check"></i> Admin Login
                        </button>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <small class="text-muted">
                            Not an admin?
                            <a href="{{ url_for('owner_login') }}" class="text-decoration-none fw-semibold">
                                Owner Login
                            </a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
